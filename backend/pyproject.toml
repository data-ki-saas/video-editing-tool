[project]
name = "backend"
version = "0.1.0"
description = "Reel Creator backend: FastAPI + Supabase + Cloudflare R2"
authors = [
    { name = "Abhinandan Prateek", email = "aprateek@smart-structures.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "supabase>=2.10",
    "boto3>=1.35",
    "anthropic>=0.40",
    "httpx>=0.27",
    "edge-tts>=6.1",
    "mutagen>=1.47",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "moto[server]>=5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
