[project]
name = "face-analysis"
version = "0.1.0"
description = "Standalone MediaPipe face-landmark analysis service (CPU-only, Docker-deployed on Render) -- backs backend/src/avatar_gen's photo-to-avatar pipeline over HTTP, since Render's native Python runtime can't load mediapipe's libGLESv2 dependency (no apt/root access there)."
authors = [
    { name = "Abhinandan Prateek", email = "aprateek@smart-structures.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "mediapipe>=0.10.14",
    "pillow>=10.4",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
