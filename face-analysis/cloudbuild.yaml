# Explicit build config (replaces the trigger's auto-detected "Dockerfile"
# build type) -- needed only because a custom-service-account trigger (what
# Cloud Run's own "Continuously deploy" wizard creates) requires an explicit
# logging destination, which isn't exposed as a console field for the
# Dockerfile-only build type; see options.logging below.
#
# Deliberately uses ONLY Cloud Build's guaranteed built-in substitutions
# ($PROJECT_ID, $COMMIT_SHA) plus literal values confirmed from the actual
# deployed service (region europe-west1, service name "mediapipe", from
# https://mediapipe-885914981821.europe-west1.run.app) -- an earlier attempt
# used $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME assuming
# Cloud Run's wizard had pre-populated those as trigger substitutions; it
# hadn't (they were internal to the auto-detected Dockerfile mode, not
# reusable here), and every one resolved empty.
#
# "cloud-run-source-deploy" is Cloud Run's own standard default Artifact
# Registry repo name for this exact "Continuously deploy from a repository"
# flow -- if this build 403s or 404s on push, check Artifact Registry >
# Repositories (region europe-west1) for the actual repo name and swap it in
# below instead of guessing again.
#
# The deploy step intentionally passes only --image/--region/--platform --
# every other setting configured via console (GPU, min/max instances, env
# vars, ingress, unauthenticated access) lives on the Service/revision
# template already and `gcloud run deploy` carries it forward unless you
# explicitly override it, so this won't silently reset anything you set up
# earlier in this conversation.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - "-t"
      - "europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/face-analysis:$COMMIT_SHA"
      - "-f"
      - face-analysis/Dockerfile
      - face-analysis

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - "europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/face-analysis:$COMMIT_SHA"

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - mediapipe
      - --image=europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/face-analysis:$COMMIT_SHA
      - --region=europe-west1
      - --platform=managed
      - --quiet

images:
  - "europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/face-analysis:$COMMIT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY
